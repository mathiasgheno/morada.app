name: Desktop builds

on:
  push:
    branches: [feature/desktop-builds]
    paths-ignore: ['**/*.md']
  workflow_dispatch:
    inputs:
      platform:
        description: Plataforma para validar
        type: choice
        default: all
        options: [all, macos, windows, linux]

permissions:
  contents: read

concurrency:
  group: desktop-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.platforms.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - run: bun run test
      - id: platforms
        uses: actions/github-script@v7
        with:
          script: |
            const variants = [
              { os: 'macos', runner: 'macos-15', target: 'aarch64-apple-darwin', bundles: 'app,dmg' },
              { os: 'macos', runner: 'macos-15-intel', target: 'x86_64-apple-darwin', bundles: 'app,dmg' },
              { os: 'windows', runner: 'windows-2022', target: 'x86_64-pc-windows-msvc', bundles: 'nsis' },
              { os: 'linux', runner: 'ubuntu-24.04', target: 'x86_64-unknown-linux-gnu', bundles: 'appimage,deb' },
              { os: 'linux', runner: 'ubuntu-24.04-arm', target: 'aarch64-unknown-linux-gnu', bundles: 'appimage,deb' },
            ];
            const selected = context.payload.inputs?.platform || 'all';
            core.setOutput('matrix', JSON.stringify({ include: variants.filter(v => selected === 'all' || selected === v.os) }));
  build:
    needs: checks
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.checks.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: desktop-${{ matrix.target }}
      - name: Dependências Linux
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev
      - run: bun install --frozen-lockfile
      - name: Build dos instaladores de teste
        run: bun run desktop:build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
      - name: Validar runtime e persistência sem dados pessoais
        run: bun desktop/smoke.mjs
      - name: Validar Bun dentro do pacote macOS assinado ad hoc
        if: matrix.os == 'macos'
        run: |
          bun desktop/smoke.mjs --binary src-tauri/target/${{ matrix.target }}/release/bundle/macos/Morada.app/Contents/MacOS/morada-runtime --resources src-tauri/target/${{ matrix.target }}/release/bundle/macos/Morada.app/Contents/Resources/runtime
          codesign --verify --deep --strict src-tauri/target/${{ matrix.target }}/release/bundle/macos/Morada.app
      - name: Guardar pacotes para teste (sem publicar release)
        uses: actions/upload-artifact@v4
        with:
          name: morada-${{ matrix.target }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14
