<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light dark">
  <title>Seus projetos · Morada</title>
  <script src="/src/theme.mjs"></script><link rel="stylesheet" href="/ui.css">
  <link rel="icon" href="/assets/morada-symbol.svg" type="image/svg+xml"><link rel="stylesheet" href="/launcher.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script defer src="https://unpkg.com/protomaps-leaflet@5.0.0/dist/protomaps-leaflet.js"></script>
  <script type="module" src="/src/launcher.mjs"></script>
</head>
<body>
  <header class="launcher-brand">
    <a class="brand" href="/launcher.html" aria-label="Morada — seus projetos"><img src="/assets/morada-symbol.svg" alt="" width="68" height="68"><span>morada<span class="brand-dot">.</span><small>SEU PRÓXIMO LUGAR</small></span></a>
  </header>
  <main class="launcher-main">
    <section aria-labelledby="projectsTitle"><div class="section-heading"><h1 id="projectsTitle">Meus projetos <span id="projectTotal" class="project-total">–</span></h1></div><p id="launcherStatus" role="status">Carregando seus projetos…</p><div id="projectGrid" class="project-grid"></div></section>
    <button id="newProject" class="primary-button new-project-button" type="button"><span aria-hidden="true">＋</span> Novo projeto</button>
  </main>
  <dialog id="projectDialog" aria-labelledby="projectDialogTitle">
    <form id="projectForm"><div class="dialog-heading"><h2 id="projectDialogTitle">Novo projeto</h2><button id="closeProjectDialog" class="icon-button" type="button" aria-label="Fechar">✕</button></div>
      <label for="projectNameInput">Nome do projeto</label><input id="projectNameInput" required maxlength="120" placeholder="Ex.: Morando perto do Arca" autocomplete="off">
      <label for="projectCity">Cidade</label><input id="projectCity" value="São Paulo, São Paulo" disabled>
      <label class="reference-toggle"><input id="useReference" type="checkbox"> Definir ponto de referência (opcional)</label>
      <fieldset id="referenceFields" disabled hidden>
      <div class="field-pair"><div><label for="referenceName">Ponto de referência</label><input id="referenceName" required maxlength="120" placeholder="Ex.: Arca"></div><div><label for="referenceAddress">Endereço</label><input id="referenceAddress" maxlength="400" placeholder="São Paulo, SP"><p id="referenceAddressStatus" class="field-help" role="status"></p></div></div>
      <details id="referenceDetails"><summary>Escolher localização no mapa</summary><p class="field-help">Clique no mapa para atualizar o ponto e buscar o endereço aproximado online, via Photon/OpenStreetMap. Você pode ajustar o endereço depois.</p><div id="referenceMap" aria-label="Escolher ponto de referência em São Paulo"></div><div class="field-pair coordinate-fields"><div><label for="referenceLat">Latitude</label><input id="referenceLat" type="number" step="any" min="-24.2" max="-23.1" required></div><div><label for="referenceLng">Longitude</label><input id="referenceLng" type="number" step="any" min="-47.2" max="-46" required></div></div></details>
      </fieldset>
      <p id="projectFormStatus" role="status"></p><div class="dialog-actions"><button id="cancelProjectDialog" class="secondary-button" type="button">Cancelar</button><button id="saveProject" class="primary-button" type="submit">Criar projeto</button></div>
    </form>
  </dialog>
</body>
</html>
